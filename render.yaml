services:
  - type: web
    name: pitchku-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # 22, bukan 20: @supabase/supabase-js sudah mendeprekasi Node 20 dan
      # mengeluarkan peringatan EBADENGINE saat build.
      - key: NODE_VERSION
        value: "22"

      # Satu deck 10 slide dibuat dalam satu panggilan ke pitchku-ai, dan
      # model lokal lewat Ollama bisa butuh beberapa menit.
      - key: AI_TIMEOUT_MS
        value: "180000"

      # Label model di generation_logs. pitchku-ai tidak menyebutkan model
      # yang dipakai, jadi tulis sesuai OLLAMA_MODEL di sana.
      - key: LLM_MODEL
        value: pitchku-ai

      # ---- Wajib diisi manual di dashboard Render ----
      # Tanpa SUPABASE_URL dan satu kunci publik, server menolak start dan
      # deploy gagal. Itu memang disengaja - lihat need() di src/env.js.
      - key: SUPABASE_URL
        sync: false

      # Kalau proyek Supabase kamu memakai nama baru (sb_publishable_... dan
      # sb_secret_...), hapus dua key di bawah dan ganti namanya jadi
      # SUPABASE_PUBLISHABLE_KEY dan SUPABASE_SECRET_KEY. Kode menerima
      # kedua gaya penamaan.
      - key: SUPABASE_ANON_KEY
        sync: false
      # Dipakai menulis generation_logs (melewati RLS).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # URL service pitchku-ai, TANPA garis miring di akhir. Backend memanggil
      # {AI_SERVICE_URL}/api/v1/decks/generate.
      # Contoh: https://pitchku-ai.onrender.com
      - key: AI_SERVICE_URL
        sync: false

      # Opsional. Dikirim sebagai header x-internal-key; pitchku-ai saat ini
      # belum memeriksanya.
      - key: INTERNAL_API_KEY
        sync: false

      # Domain frontend, contoh: https://pitchku.vercel.app
      # Beberapa domain dipisah koma.
      - key: CORS_ORIGIN
        sync: false

      # URL backend ini sendiri, supaya "Try it out" di /docs tidak
      # menembak localhost. Contoh: https://pitchku-backend.onrender.com
      - key: PUBLIC_URL
        sync: false
